<!doctype html>
<!-- Standalone copy of the website's scripted session preview
     (apps/website/sites/tutor.new/_includes/partials/session-preview.njk plus its
     site.css block), embedded by the "what-we-do" slide in a 9:5 iframe. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vorschau einer Lernsitzung</title>
<style>
/* Nunito is self-hosted (fonts/, copied from the website) so the preview makes
   no request to a third-party font service. */
@font-face { font-family: "Nunito"; font-style: italic; font-weight: 400; font-display: swap; src: url("fonts/nunito-italic-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Nunito"; font-style: italic; font-weight: 400; font-display: swap; src: url("fonts/nunito-italic-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Nunito"; font-style: normal; font-weight: 400 800; font-display: swap; src: url("fonts/nunito-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Nunito"; font-style: normal; font-weight: 400 800; font-display: swap; src: url("fonts/nunito-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

@font-face {
    font-family: "Sour Gummy";
    src: url("../SourGummy_400Regular.ttf") format("truetype");
    font-weight: 400;
}

@font-face {
    font-family: "Sour Gummy";
    src: url("../SourGummy_700Bold.ttf") format("truetype");
    font-weight: 600 700;
}

:root {
    --s-bg: #f9f1e8;
    --s-bg-2: #f6ecdf;
    --s-bg-3: #ebdecb;
    --s-ink: #0e3322;
    --s-ink-2: #3c5246;
    --s-muted: #6c7a89;
    --s-line: #e7dccb;
    --s-line-cool: #e8ecef;
    --s-card: #ffffff;
    --s-paper: #f7f9fb;
    --s-bubble: #f4e6d9;
    --s-sky: #0ea5e9;
    --s-rose: #f43f5e;
    --s-yellow: #facc15;
    --s-indigo: #6366f1;
    --s-emerald: #34d399;
    --s-orange: #f97316;
    --s-teal: #14b8a6;
    --s-purple: #a855f7;
    --s-success: #22c55e;
    --s-error: #ef4444;
    --s-call: linear-gradient(100deg, #ffaf7b, #d76d77 38%, #3a1c71 100%);
    --s-display: "Sour Gummy", ui-rounded, "Nunito", system-ui, sans-serif;
    --s-text: "Nunito", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --s-r-m: 8px;
    --s-r-l: 16px;
    --s-r-xl: 24px;
    --s-shadow: 0 1px 0 rgba(14, 51, 34, .05), 0 18px 44px rgba(14, 51, 34, .1);
    --s-shadow-sm: 0 1px 0 rgba(14, 51, 34, .05), 0 6px 18px rgba(14, 51, 34, .07);
}

*,
*::before,
*::after {
    box-sizing: border-box;
    list-style: none;
}

html,
body {
    margin: 0;
    overflow: hidden;
    background: transparent;
}

.s-sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
}

/* ---------- Session preview (replica of the Expo live focus session) ---------- */

.fs-figure {
    width: min(1080px, calc(100% - 32px));
    margin: 0 auto;
}

.fs {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 42fr) 0 minmax(0, 58fr);
    height: 600px;
    border-radius: 22px;
    border: 1.5px solid var(--s-line);
    background: var(--s-bg);
    box-shadow: 0 2px 0 rgba(14, 51, 34, .05), 0 34px 80px rgba(14, 51, 34, .16);
    overflow: hidden;
    text-align: left;
    font-family: var(--s-text);
    font-size: 15px;
    line-height: 1.5;
    color: #11181c;
    user-select: none;
}

.fs svg {
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.fs-mobilebar {
    display: none;
}

/* chat column */

.fs-chat {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #f9f1e8;
    border-right: 1.5px solid var(--s-line-cool);
}

.fs-chat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    padding: 0 16px;
    background: rgba(255, 240, 229, .8);
    border-bottom: 1px solid var(--s-line);
}

.fs-coin {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--s-display);
    font-weight: 700;
    font-size: 16px;
    color: var(--s-ink);
}

.fs-coin img {
    width: 30px;
    height: 30px;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(160, 100, 20, .35);
}

.fs-coin-plus {
    position: absolute;
    left: 100%;
    top: 50%;
    margin-left: 8px;
    padding: 1px 9px;
    border-radius: 999px;
    background: #fff4cf;
    border: 1px solid #f1d27a;
    color: #8a5a00;
    font-style: normal;
    font-size: 13px;
    opacity: 0;
    transform: translateY(40%);
    transition: opacity .35s ease, transform .5s cubic-bezier(.2, 1.4, .4, 1);
}

.fs-coin-plus.is-on {
    opacity: 1;
    transform: translateY(-50%);
}

.fs:not(.fs-anim) .fs-coin-plus {
    display: none;
}

.fs-leave {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 999px;
    background: rgba(239, 68, 68, .14);
    border: 1px solid rgba(239, 68, 68, .3);
    color: var(--s-error);
}

.fs-leave svg {
    width: 18px;
    height: 18px;
}

.fs-thread {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 12px;
    padding: 14px 18px 12px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent, #000 34px);
    mask-image: linear-gradient(transparent, #000 34px);
}

.fs-subject {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 4px;
    color: var(--s-muted);
    font-size: 14px;
}

.fs-subject i {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: var(--s-sky);
}

.fs-msg {
    max-width: 100%;
}

.fs-msg-user {
    align-self: flex-end;
    max-width: 84%;
    padding: 9px 15px;
    border-radius: 22px;
    background: var(--s-bubble);
    border: 1px solid rgba(99, 102, 241, .18);
}

.fs-msg-voice {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(14, 51, 34, .08);
    border-color: rgba(99, 102, 241, .48);
}

.fs-msg-voice svg {
    flex: 0 0 auto;
    width: 15px;
    height: 15px;
    color: var(--s-indigo);
}

.fs-tool {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    align-self: flex-start;
    padding: 4px 11px 4px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .7);
    border: 1px solid var(--s-line);
    color: var(--s-muted);
    font-size: 12.5px;
    font-weight: 600;
}

.fs-tool svg {
    width: 14px;
    height: 14px;
    color: var(--s-success);
    stroke-width: 2.6;
}

.fs-typing {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--s-muted);
    font-size: 13px;
}

.fs-typing span {
    display: inline-flex;
    gap: 3px;
}

.fs-typing i {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--s-muted);
    animation: fs-bounce 1.1s infinite ease-in-out;
}

.fs-typing i:nth-child(2) {
    animation-delay: .15s;
}

.fs-typing i:nth-child(3) {
    animation-delay: .3s;
}

@keyframes fs-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .45; }
    30% { transform: translateY(-4px); opacity: 1; }
}

.fs:not(.fs-anim) .fs-typing {
    display: none;
}

.fs-suggest {
    display: flex;
    gap: 10px;
}

.fs-suggest span {
    flex: 1 1 0;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, .6);
    border: 1px solid rgba(99, 102, 241, .25);
    color: var(--s-muted);
    font-size: 12.5px;
    line-height: 1.35;
}

.fs-suggest b {
    display: block;
    margin-bottom: 2px;
    color: var(--s-ink);
    font-size: 13.5px;
    font-weight: 700;
}

.fs-composer {
    margin: 0 14px 14px;
    padding: 14px 12px 10px;
    border-radius: 28px;
    background: var(--s-paper);
    box-shadow: 0 6px 22px rgba(14, 51, 34, .1);
}

.fs-input {
    padding: 2px 10px 14px;
    color: #8b97a3;
    font-size: 15.5px;
}

.fs-composer-row {
    display: flex;
    align-items: center;
    gap: 7px;
}

.fs-ibtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-width: 36px;
    height: 36px;
    padding: 0 9px;
    border-radius: 999px;
    background: var(--s-bg-2);
    border: 1px solid var(--s-line);
    color: var(--s-ink);
}

.fs-ibtn svg {
    width: 17px;
    height: 17px;
}

.fs-timer b {
    font-family: var(--s-display);
    font-size: 13px;
    font-weight: 600;
}

.fs-call {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 38px;
    margin-left: auto;
    padding: 0 8px 0 16px;
    border-radius: 999px;
    background: var(--s-call);
    color: #fff;
    font-family: var(--s-display);
    font-size: 14.5px;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 6px 16px rgba(58, 28, 113, .28);
}

.fs-call svg {
    flex: none;
    width: 26px;
    height: 26px;
    padding: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .22);
}

.fs-handle {
    position: relative;
    z-index: 3;
    align-self: center;
    display: grid;
    grid-template-columns: 4px 4px;
    gap: 3px;
    width: 0;
    margin-left: -6px;
}

.fs-handle i {
    width: 4px;
    height: 4px;
    border-radius: 999px;
    background: var(--s-muted);
}

/* notes workspace */

.fs-notes {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: #fff;
}

.fs-tabs {
    display: flex;
    height: 56px;
    background: var(--s-paper);
    border-bottom: 1px solid var(--s-line-cool);
}

.fs-tabs span {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 0 22px 0 12px;
    border-right: 1px solid var(--s-line-cool);
    color: var(--s-muted);
    font-family: var(--s-display);
    font-size: 15px;
    font-weight: 600;
}

.fs-tabs span.is-active {
    color: var(--s-ink);
    background: #fff;
}

.fs-tabs svg {
    width: 17px;
    height: 17px;
}

.fs-tabs .fs-tabs-add {
    margin-left: auto;
    padding: 0 18px;
    border-right: 0;
    border-left: 1px solid var(--s-line-cool);
    color: var(--s-ink);
}

.fs-paper {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: radial-gradient(circle, #cfd4da 1.1px, transparent 1.4px) 0 0 / 20px 20px #fff;
}

.fs-sheet {
    padding: 26px 28px 20px;
    font-size: 14.5px;
    line-height: 1.55;
}

.fs-sheet > p {
    margin: 10px 0 6px;
    padding-right: 168px;
}

.fs-row {
    display: grid;
    grid-template-columns: 104px minmax(0, 1fr);
    gap: 18px;
    padding-top: 10px;
    border-top: 1px solid #d5d8dc;
}

.fs-row > b {
    align-self: start;
    padding-bottom: 3px;
    border-bottom: 1.5px solid #c9cdd2;
}

.fs-row p + p {
    margin-top: 6px;
}

.fs-row-head {
    padding: 0 0 8px;
    border-top: 0;
    border-bottom: 2px solid #6b1f7a;
    font-size: 15.5px;
}

.fs-row-head > b {
    border: 0;
    padding: 0;
}

.fs-math {
    font-family: "Latin Modern Math", "STIX Two Text", "Cambria Math", Georgia, serif;
    font-style: italic;
    white-space: nowrap;
}

.fs-graph {
    width: min(280px, 74%);
    margin: 0 auto 4px;
}

.fs-graph svg {
    display: block;
    width: 100%;
    height: auto;
}

.fs-grid path {
    stroke: #eceef1;
    stroke-width: 1;
}

.fs-axes path {
    stroke: #11181c;
    stroke-width: 1.6;
}

.fs-axes .fs-arrow {
    fill: #11181c;
    stroke-width: 1;
}

.fs-ticks text {
    fill: #4b5563;
    stroke: none;
    font: 12px var(--s-text);
    text-anchor: middle;
}

.fs-ticks .fs-axis-name {
    fill: #11181c;
    font-weight: 700;
    font-size: 13px;
}

.fs-curve {
    stroke-width: 3;
    stroke-dasharray: 1;
    stroke-dashoffset: 0;
}

.fs-curve-f {
    stroke: #ef4444;
}

.fs-curve-g {
    stroke: #3b82f6;
}

.fs-dot-f {
    fill: #ef4444;
    stroke: none;
}

.fs-dot-g {
    fill: #3b82f6;
    stroke: none;
}

.fs-label-f,
.fs-label-g {
    stroke: none;
    font: 700 14px var(--s-text);
}

.fs-label-f {
    fill: #ef4444;
}

.fs-label-g {
    fill: #3b82f6;
}

/* call picture-in-picture */

.fs-pip {
    position: absolute;
    z-index: 2;
    top: 12px;
    right: 12px;
    width: 172px;
    height: 124px;
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(180deg, #3a1c71 0%, #a44a7c 52%, #f08a5d 100%);
    box-shadow: 0 12px 28px rgba(28, 12, 60, .32);
}

.fs-pip img {
    position: absolute;
    left: 50%;
    top: 6px;
    width: 190px;
    max-width: none;
    transform: translateX(-46%);
    animation: fs-breathe 5s ease-in-out infinite;
}

@keyframes fs-breathe {
    50% { transform: translateX(-46%) translateY(1.5px) scale(1.012); }
}

.fs-pip-live {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--s-error);
    box-shadow: 0 0 0 0 rgba(239, 68, 68, .6);
    animation: fs-live 1.8s infinite;
}

@keyframes fs-live {
    70% { box-shadow: 0 0 0 7px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}

.fs-pip-ctrls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 8px;
    display: flex;
    justify-content: center;
    gap: 6px;
}

.fs-pip-ctrls i {
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    border-radius: 999px;
    background: rgba(40, 40, 50, .55);
    color: #fff;
}

.fs-pip-ctrls .fs-pip-end {
    background: var(--s-error);
}

.fs-pip-ctrls svg {
    width: 14px;
    height: 14px;
}

.fs-pip-end svg {
    fill: #fff;
    stroke: none;
}

.fs-fab {
    position: absolute;
    right: 14px;
    bottom: 14px;
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--s-line-cool);
    box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    color: #11181c;
}

.fs-fab svg {
    width: 18px;
    height: 18px;
}

/* timeline states (only once the script has opted in) */

.fs-anim [data-fs-step] {
    display: none;
}

.fs-anim [data-fs-step].is-on {
    display: block;
    animation: fs-in .4s ease both;
}

.fs-anim .fs-msg-voice.is-on,
.fs-anim .fs-tool.is-on {
    display: inline-flex;
}

.fs-anim .fs-typing.is-on,
.fs-anim .fs-suggest.is-on {
    display: flex;
}

.fs-anim .fs-row.is-on {
    display: grid;
}

.fs-anim [data-fs-step].is-gone {
    display: none;
}

@keyframes fs-in {
    from { opacity: 0; transform: translateY(8px); }
}

.fs-anim .fs-w {
    opacity: 0;
    transition: opacity .25s ease;
}

.fs-anim .fs-w.is-on {
    opacity: 1;
}

.fs-anim .fs-graph.is-on .fs-curve {
    animation: fs-draw 1.5s ease-out both;
}

.fs-anim .fs-graph.is-on .fs-curve-g {
    animation-delay: .7s;
}

@keyframes fs-draw {
    from { stroke-dashoffset: 1; }
}

/* phone: one pane at a time behind the app's Chat | Notizen control */

/* Deck embedding: the stage keeps its 1080x600 design size and is scaled to fit
   the iframe in both directions, so it can never be cut off.
   tan(atan2(a, b)) yields the unitless ratio of two lengths: no script needed,
   and it also holds in print. */
.fs-figure {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1080px;
    margin: 0;
    transform: translate(-50%, -50%) scale(min(tan(atan2(100vw, 1080px)), tan(atan2(100vh, 600px))));
    transform-origin: center center;
}

/* 3D Maya renders into a canvas above the still image; the image stays as the
   fallback (no WebGL, reduced motion, print). */
/* As in the app, the call tile floats in the top-right corner of the notes
   pane, over the tab bar's "+". */
.fs-notes {
    position: relative;
}

.fs-pip {
    top: 10px;
    right: 10px;
}

.fs-pip canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.fs-pip img {
    transition: opacity .6s ease;
}

.fs-pip.is-3d img {
    opacity: 0;
}

.fs {
    box-shadow: none;
}

/* Print shows the finished session instead of whatever frame the timeline is on. */
@media print {
    .fs-anim [data-fs-step] {
        display: block !important;
        animation: none !important;
    }

    .fs-anim .fs-msg-voice,
    .fs-anim .fs-tool {
        display: inline-flex !important;
    }

    .fs-anim .fs-suggest {
        display: flex !important;
    }

    .fs-anim .fs-row {
        display: grid !important;
    }

    .fs-anim .fs-typing {
        display: none !important;
    }

    .fs-anim .fs-w {
        opacity: 1 !important;
    }

    .fs-anim .fs-curve {
        animation: none !important;
    }

    .fs-pip canvas {
        display: none;
    }

    .fs-pip.is-3d img {
        opacity: 1;
    }
}
</style>

<body>
<figure class="fs-figure">
    <figcaption class="s-sr">
        Vorschau einer Focus Session: Links chattet eine Schülerin mit Tutorin Maya über die
        Parabel g(x) = x² + 2. Maya antwortet mit einer Rückfrage statt mit der Lösung. Rechts
        entsteht dabei die Mitschrift mit Erklärung, Graph und Aufgaben; oben rechts läuft der
        Videoanruf mit der Tutorin.
    </figcaption>
    <div class="fs" data-fs data-tab="chat" aria-hidden="true">
        <div class="fs-mobilebar">
            <span class="fs-coin"><img src="coin.png" alt="" width="22" height="22"><b data-fs-coins>12</b></span>
            <span class="fs-seg">
                <button type="button" tabindex="-1" data-fs-tab="chat">Chat</button>

<script>
    // Timeline for the session preview. Steps are revealed in the order below (not DOM
    // order) so the notes fill in while the tutor is "writing", like in the real app.
    (function () {
        var root = document.querySelector("[data-fs]");
        if (!root || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        var chatSteps = root.querySelectorAll(".fs-chat [data-fs-step]");
        var noteSteps = root.querySelectorAll(".fs-notes [data-fs-step]");
        // user question, typing, tool card + graph, tasks, tutor answer, voice reply, praise, suggestions
        var order = [chatSteps[0], chatSteps[1], chatSteps[2], noteSteps[0], noteSteps[1],
            chatSteps[3], chatSteps[4], chatSteps[5], chatSteps[6]];
        var coins = root.querySelectorAll("[data-fs-coins]");
        var plus = root.querySelector("[data-fs-plus]");
        var typing = root.querySelector(".fs-typing");
        var timers = [];
        // Tutor text streams at speaking pace so the talking head can lip-sync to it.
        var WORD_MS = 240;
        var userPickedTab = false;

        order.forEach(function (el) {
            if (el.hasAttribute("data-fs-stream")) {
                el.innerHTML = el.textContent.trim().split(/\s+/).map(function (w) {
                    return "<span class=\"fs-w\">" + w + "</span>";
                }).join(" ");
            }
        });
        root.classList.add("fs-anim");

        root.querySelectorAll("[data-fs-tab]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                userPickedTab = true;
                root.setAttribute("data-tab", btn.getAttribute("data-fs-tab"));
            });
        });

        function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

        function reset() {
            timers.forEach(clearTimeout);
            timers = [];
            order.forEach(function (el) {
                el.classList.remove("is-on", "is-gone");
                el.querySelectorAll(".fs-w").forEach(function (w) { w.classList.remove("is-on"); });
            });
            coins.forEach(function (c) { c.textContent = "12"; });
            plus.classList.remove("is-on");
            window.fsMayaSpeaking = false;
            window.fsMayaWriting = false;
            if (!userPickedTab) root.setAttribute("data-tab", "chat");
        }

        function play() {
            reset();
            var t = 1200;
            order.forEach(function (el) {
                t += Number(el.getAttribute("data-fs-wait") || 0);
                var at = t;
                later(function () {
                    if (!userPickedTab) {
                        root.setAttribute("data-tab", el.closest(".fs-notes") ? "notes" : "chat");
                    }
                    el.classList.add("is-on");
                }, at);
                if (el === typing) later(function () { window.fsMayaWriting = true; }, at);
                if (el.hasAttribute("data-fs-stream")) {
                    var words = el.querySelectorAll(".fs-w");
                    var speakMs = words.length * WORD_MS;
                    var text = el.textContent;
                    later(function () {
                        typing.classList.add("is-gone");
                        window.fsMayaWriting = false;
                        window.fsMayaSpeaking = true;
                        if (window.fsSpeak) window.fsSpeak(text, speakMs);
                        if (window.fsSmile && /Genau|Gute Frage/.test(text)) window.fsSmile();
                        if (window.fsBrows && text.indexOf("?") >= 0) window.fsBrows();
                    }, at);
                    words.forEach(function (w, i) {
                        later(function () { w.classList.add("is-on"); }, at + i * WORD_MS);
                    });
                    later(function () { window.fsMayaSpeaking = false; }, at + speakMs);
                    t += speakMs;
                }
                if (el.hasAttribute("data-fs-coin")) {
                    later(function () {
                        plus.classList.add("is-on");
                        coins.forEach(function (c) { c.textContent = "17"; });
                    }, t + 300);
                }
            });
            later(play, t + 7000);
        }

        // On a slide the preview should start from the top each time its slide
        // comes into view, and stop while the slide is hidden.
        if (!("IntersectionObserver" in window)) return play();
        new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting) play(); else reset();
        }, { threshold: 0.35 }).observe(root);
    })();
</script>

<script type="module">
// Muted 3D talking head in the call tile, ported from the live homepage
// (apps/website/sites/tutor.new/index.html). three.js is vendored so the deck
// works offline. Mouth movement follows real viseme timelines (TalkingHead's
// German lipsync rules) spread over the time the text takes to appear; the
// timeline script above sets fsMayaSpeaking / fsMayaWriting and calls fsSpeak.
// Any failure leaves the still image in place.
(async () => {
    const tile = document.querySelector('.fs-pip');
    const canvas = document.getElementById('fs-pip-canvas');
    if (tile === null || canvas === null) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    try {
        const THREE = await import('three');
        const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');

        let lipsync = null;
        try {
            const mod = await import('./lipsync-de.js');
            lipsync = new mod.LipsyncDe();
        } catch (e) { lipsync = null; }

        const renderer = new THREE.WebGLRenderer({
            canvas,
            alpha: true,
            antialias: true,
            powerPreference: 'high-performance'
        });
        // The whole stage is CSS-scaled up on large screens, so render generously.
        const renderScale = 2;
        const resizeRenderer = () => {
            const W = Math.max(1, Math.round(tile.clientWidth * renderScale));
            const H = Math.max(1, Math.round(tile.clientHeight * renderScale));
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.5));
            renderer.setSize(W, H, false);
            cam.aspect = W / H;
            cam.updateProjectionMatrix();
        };
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;

        const scene = new THREE.Scene();
        const cam = new THREE.PerspectiveCamera(28, tile.clientWidth / tile.clientHeight, 0.05, 10);
        scene.add(new THREE.AmbientLight(0xffffff, 1.25));
        const key = new THREE.DirectionalLight(0xffffff, 1.5);
        key.position.set(0.5, 0.8, 1);
        scene.add(key);

        const gltf = await new Promise((res, rej) =>
            new GLTFLoader().load('./maya.glb', res, undefined, rej));
        scene.add(gltf.scene);

        let headBone = null;
        const morphMeshes = [];
        gltf.scene.traverse(o => {
            if (o.isBone && o.name === 'Head') headBone = o;
            if (o.morphTargetDictionary) morphMeshes.push(o);
            if (o.isMesh && o.material) {
                const materials = Array.isArray(o.material) ? o.material : [o.material];
                materials.forEach(material => {
                    ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap'].forEach(k => {
                        const texture = material[k];
                        if (texture) {
                            texture.generateMipmaps = true;
                            texture.minFilter = THREE.LinearMipmapLinearFilter;
                            texture.magFilter = THREE.LinearFilter;
                            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                            texture.needsUpdate = true;
                        }
                    });
                });
            }
            o.frustumCulled = false;
        });

        gltf.scene.updateWorldMatrix(true, true);
        const headPos = new THREE.Vector3();
        (headBone === null ? gltf.scene : headBone).getWorldPosition(headPos);

        // Framing for the 172x124 call tile: the face sits in the upper part so the
        // call buttons along the bottom edge do not cover the mouth.
        const camParams = { y: -0.015, z: 1.06, ly: 0.027, fov: 28 };
        const applyCam = () => {
            cam.position.set(headPos.x, headPos.y + camParams.y, headPos.z + camParams.z);
            cam.fov = camParams.fov;
            cam.updateProjectionMatrix();
            cam.lookAt(headPos.x, headPos.y + camParams.ly, headPos.z);
        };
        resizeRenderer();
        applyCam();
        // The deck loads this page while its slide is still hidden, so the tile
        // measures 0x0 at first; follow it once it gets its real size.
        new ResizeObserver(() => {
            resizeRenderer();
            applyCam();
        }).observe(tile);

        const setMorph = (name, v) => morphMeshes.forEach(m => {
            const i = m.morphTargetDictionary[name];
            if (i !== undefined) m.morphTargetInfluences[i] = v;
        });

        // Oculus viseme -> ARKit blendshape combos (maya.glb has ARKit only)
        const VISEMES = {
            'aa': { jawOpen: .45, mouthOpen: .45 },
            'E':  { jawOpen: .24, mouthOpen: .3, mouthSmile: .25 },
            'I':  { jawOpen: .12, mouthOpen: .2, mouthSmile: .4 },
            'O':  { jawOpen: .32, mouthOpen: .3, mouthFunnel: .45, mouthPucker: .25 },
            'U':  { jawOpen: .18, mouthOpen: .18, mouthPucker: .55, mouthFunnel: .3 },
            'PP': { mouthPressLeft: .5, mouthPressRight: .5, mouthClose: .3, jawOpen: .03 },
            'FF': { mouthShrugUpper: .4, mouthRollLower: .35, jawOpen: .07 },
            'TH': { jawOpen: .15, mouthOpen: .18 },
            'DD': { jawOpen: .16, mouthOpen: .2 },
            'kk': { jawOpen: .18, mouthOpen: .15 },
            'CH': { jawOpen: .16, mouthFunnel: .45, mouthPucker: .3 },
            'SS': { jawOpen: .09, mouthSmile: .3 },
            'nn': { jawOpen: .12, mouthOpen: .1 },
            'RR': { jawOpen: .16, mouthPucker: .2 },
            'sil': {}
        };
        const MORPHS = ['jawOpen', 'mouthOpen', 'mouthFunnel', 'mouthPucker', 'mouthSmile',
            'mouthPressLeft', 'mouthPressRight', 'mouthClose', 'mouthShrugUpper', 'mouthRollLower'];
        const current = {};
        MORPHS.forEach(m => { current[m] = 0; });

        // text -> relative viseme timeline, converted once and cached
        const cache = new Map();
        const relTimeline = (text) => {
            let rel = cache.get(text);
            if (rel !== undefined) return rel;
            const items = [];
            let t = 0;
            const words = lipsync.preProcessText(text).split(/\s+/).filter(w => w.length > 0);
            words.forEach(w => {
                const o = lipsync.wordsToVisemes(w);
                const n = o.visemes.length;
                for (let i = 0; i < n; i++) {
                    items.push({ v: o.visemes[i], s: t + o.times[i], d: o.durations[i] });
                }
                t += (n > 0 ? o.times[n - 1] + o.durations[n - 1] : 1) + 1.6;
            });
            rel = { items, total: Math.max(t, 1) };
            cache.set(text, rel);
            return rel;
        };

        // The whole sentence is spread over the time its words take to appear.
        let speech = null;
        window.fsSpeak = (text, ms) => {
            if (lipsync === null) return;
            try {
                const rel = relTimeline(text);
                speech = { rel, t0: performance.now(), scale: ms / rel.total, idx: 0 };
            } catch (e) { speech = null; }
        };

        let blinkUntil = 0, nextBlink = performance.now() + 1500;
        let writeAmt = 0, lastWriting = -1e9, prevDown = 0;
        let smileUntil = 0, smileAmt = 0, browsUntil = 0, browAmt = 0;
        window.fsSmile = () => { smileUntil = performance.now() + 1900; };
        window.fsBrows = () => { browsUntil = performance.now() + 1300; };
        const tick = () => {
            const now = performance.now();
            const t = now / 1000;
            const speaking = window.fsMayaSpeaking === true;

            const target = {};
            MORPHS.forEach(m => { target[m] = 0; });
            target.mouthSmile = 0.16;

            if (speaking && speech !== null) {
                const rt = (now - speech.t0) / speech.scale;
                const items = speech.rel.items;
                while (speech.idx < items.length && items[speech.idx].s + items[speech.idx].d < rt) speech.idx++;
                const it = items[speech.idx];
                if (it !== undefined && it.s <= rt) {
                    const def = VISEMES[it.v];
                    if (def !== undefined) {
                        Object.keys(def).forEach(k => { target[k] = Math.max(target[k], def[k]); });
                    }
                }
            } else if (speaking && lipsync === null) {
                // procedural fallback if the lipsync module is unavailable
                target.jawOpen = Math.max(0, 0.16 + 0.18 * Math.abs(Math.sin(t * 9.3)) * (0.55 + 0.45 * Math.sin(t * 2.1)));
                target.mouthOpen = target.jawOpen * 0.8;
            }

            // Micro-expressions: brief smile on praise, raised brows on questions.
            const smiling = now < smileUntil;
            smileAmt += ((smiling ? 1 : 0) - smileAmt) * (smiling ? 0.12 : 0.05);
            target.mouthSmile = Math.max(target.mouthSmile, 0.16 + smileAmt * 0.42);

            MORPHS.forEach(m => {
                current[m] += (target[m] - current[m]) * 0.4;
                setMorph(m, current[m]);
            });

            if (now > nextBlink) {
                blinkUntil = now + 130;
                nextBlink = now + 1800 + Math.random() * 3200;
            }
            const blink = now < blinkUntil ? 1 : 0;
            setMorph('eyeBlinkLeft', blink);
            setMorph('eyeBlinkRight', blink);

            // Look down while writing the notes; linger a moment before looking up.
            const writingNow = window.fsMayaWriting === true;
            if (writingNow) lastWriting = now;
            const down = (writingNow || now - lastWriting < 1600) ? 1 : 0;
            writeAmt += (down - writeAmt) * (down === 1 ? 0.08 : 0.04);
            if (prevDown === 1 && down === 0) smileUntil = Math.max(smileUntil, now + 1400);
            prevDown = down;
            setMorph('eyesLookDown', writeAmt * 0.6);

            setMorph('eyeSquintLeft', smileAmt * 0.28);
            setMorph('eyeSquintRight', smileAmt * 0.28);
            const brows = now < browsUntil;
            browAmt += ((brows ? 1 : 0) - browAmt) * 0.12;
            setMorph('browInnerUp', browAmt * 0.4);
            setMorph('browOuterUpLeft', browAmt * 0.28);
            setMorph('browOuterUpRight', browAmt * 0.28);

            if (headBone !== null) {
                headBone.rotation.y = 0.07 * Math.sin(t * 0.55) + (speaking ? 0.02 * Math.sin(t * 3.1) : 0);
                headBone.rotation.x = 0.035 * Math.sin(t * 0.41) + writeAmt * 0.4;
                headBone.rotation.z = 0.02 * Math.sin(t * 0.3);
            }

            renderer.render(scene, cam);
            requestAnimationFrame(tick);
        };
        tick();
        tile.classList.add('is-3d');
    } catch (e) {
        // still image stays in place
    }
})();
</script>
